[project]
name = "django-object-preferences"
description = "Preferences stored on any Django model instance, declared with forms"
# Pre-viable. The first published release is 0.1.0, cut once the Essential
# goals in GOALS.md are delivered; until then the version stays in 0.0.x and
# nothing is uploaded to the package index.
version = "0.1.0"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# Django alone, so the package works in any Django project.
dependencies = ["django>=5.2"]
keywords = ["django", "preferences", "settings", "jsonfield", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/django-object-preferences"
Repository = "https://github.com/django-mvp/django-object-preferences"
Issues = "https://github.com/django-mvp/django-object-preferences/issues"

[tool.hatch.build.targets.wheel]
packages = ["object_preferences"]

# Hatchling's default source distribution is the whole working tree: tests,
# documentation and CI configuration. Listing what ships
# keeps it to the package, the readme and the licence. Hatchling adds
# .gitignore itself, so that a build from the source distribution leaves out
# what the repository does. The leading slashes anchor each entry to the
# repository root, so `/README.md` does not also match `tests/README.md`.
[tool.hatch.build.targets.sdist]
include = ["/object_preferences", "/README.md", "/LICENSE"]

[dependency-groups]
# Shared toolchain bundle, pinned to a release tag so every package built this
# way runs one version of each tool. Ships ruff, mypy, deptry, pre-commit,
# pytest, pytest-django, pytest-xdist, factory-boy, coverage and django-stubs.
dev = [
    "mvp-shared[dev,test]",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["object_preferences"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# Lint and format are both ruff's: it replaces black (formatting), isort (the I
# rules) and pyupgrade (the UP rules), so those three do not appear here. The
# shared rule set lives in ruff-base.toml, copied in rather than referenced
# remotely — `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
"example/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["object_preferences"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "object_preferences/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.deptry]
extend_exclude = ["tests/", "docs/", "example/"]
